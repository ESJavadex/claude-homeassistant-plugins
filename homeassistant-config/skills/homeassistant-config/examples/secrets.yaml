# secrets.yaml - placeholders only
#
# Referenced from other files with:  key: !secret name
# Keep the real file out of git (add secrets.yaml to .gitignore) and commit a
# copy like this one, with placeholders, as secrets.yaml.example.
#
# Integrations set up in the UI keep their credentials in .storage/, not here.
# Only YAML-configured things need secrets.yaml.

# Database (only when recorder uses an external database)
recorder_db_url: "postgresql://HA_USER:CHANGE_ME@db.example.internal/homeassistant"

# REST / command_line sensors
weather_station_api_key: "CHANGE_ME"
rest_api_bearer_token: "Bearer CHANGE_ME"

# MQTT entities defined in YAML (the broker connection itself is set in the UI)
mqtt_device_password: "CHANGE_ME"

# Camera streams used in YAML (generic camera is UI-configured nowadays)
camera_front_stream_url: "rtsp://CAMERA_USER:CHANGE_ME@192.0.2.10:554/stream1"

# Webhook IDs act as passwords: make them long and random
webhook_garage_id: "CHANGE_ME_LONG_RANDOM_STRING"
